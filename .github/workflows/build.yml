name: Build DG-LAN

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── MSYS2 / MinGW64 tool-chain ──────────────────────────
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-protobuf
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-make
            make

      # ── Auto-increment patch version ────────────────────────
      - name: Bump version
        id: version
        shell: pwsh
        run: |
          $file = "application/Common/Version.h"
          $c = Get-Content $file -Raw

          if ($c -match '#define VERSION "(\d+)\.(\d+)\.(\d+)"') {
            $ver = "$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)"
          } else {
            Write-Error "Cannot parse VERSION from Version.h"; exit 1
          }

          $bt   = [DateTime]::UtcNow.ToString("yyyy-MM-dd_HH-mm")
          $hash = git rev-parse HEAD

          $c = $c -replace '#define VERSION "[^"]*"',     "#define VERSION `"$ver`""
          $c = $c -replace '#define BUILD_TIME "[^"]*"',   "#define BUILD_TIME `"$bt`""
          $c = $c -replace '#define GIT_VERSION "[^"]*"',  "#define GIT_VERSION `"$hash`""
          Set-Content $file $c -NoNewline

          $tag = ""
          if ($c -match '#define VERSION_TAG "([^"]*)"') { $tag = $Matches[1] }

          "VERSION=$ver"       >> $env:GITHUB_OUTPUT
          "VERSION_TAG=$tag"   >> $env:GITHUB_OUTPUT
          "BUILD_TIME=$bt"     >> $env:GITHUB_OUTPUT
          Write-Host "Version bumped to $ver $tag  ($bt)"

      # ── Discover MSYS2 root (differs between local and runner) ─
      - name: Detect MSYS2 root
        id: msys2root
        shell: pwsh
        run: |
          # msys2/setup-msys2 installs to RUNNER_TEMP\msys64 on GH Actions
          $candidates = @(
            (Join-Path $env:RUNNER_TEMP "msys64\mingw64"),
            "D:\a\_temp\msys64\mingw64",
            "C:\msys64\mingw64"
          )
          foreach ($c in $candidates) { Write-Host "Checking: $c  exists=$(Test-Path "$c\bin\Qt5Core.dll")" }
          $root = $candidates | Where-Object { Test-Path "$_\bin\Qt5Core.dll" } | Select-Object -First 1
          if (-not $root) { Write-Error "Cannot find MSYS2 MinGW64 root with Qt5Core.dll"; exit 1 }
          Write-Host "MSYS2 MinGW64 root: $root"
          "MINGW_ROOT=$root" >> $env:GITHUB_OUTPUT

      # ── Patch .iss for whatever ICU version MSYS2 ships ─────
      - name: Fix ICU version in installer script
        shell: pwsh
        run: |
          $root = "${{ steps.msys2root.outputs.MINGW_ROOT }}"
          $iss = "application/Setups/Windows/windows_setup.iss"
          $dll = Get-ChildItem "$root/bin/libicuin*.dll" -EA SilentlyContinue |
                 Select-Object -First 1
          if ($dll -and $dll.Name -match 'libicuin(\d+)\.dll') {
            $v = $Matches[1]
            (Get-Content $iss) `
              -replace 'libicuin\d+', "libicuin$v" `
              -replace 'libicuuc\d+', "libicuuc$v" `
              -replace 'libicudt\d+', "libicudt$v" |
              Set-Content $iss
            Write-Host "ICU version patched to $v"
          }

      # ── Build ───────────────────────────────────────────────
      - name: Build Core
        shell: msys2 {0}
        working-directory: application
        run: |
          QMAKE=$(command -v qmake-qt5 || command -v qmake || echo /mingw64/bin/qmake)
          echo "Using qmake: $QMAKE"
          $QMAKE Core.pro -r -spec win32-g++ "CONFIG+=release"
          mingw32-make -f Makefile-Core -j$(nproc)

      - name: Build GUI
        shell: msys2 {0}
        working-directory: application
        run: |
          QMAKE=$(command -v qmake-qt5 || command -v qmake || echo /mingw64/bin/qmake)
          $QMAKE GUI.pro -r -spec win32-g++ "CONFIG+=release"
          mingw32-make -f Makefile-GUI -j$(nproc)

      # ── Verify build outputs ──────────────────────────────
      - name: Verify outputs & DLLs
        shell: pwsh
        run: |
          $root = "${{ steps.msys2root.outputs.MINGW_ROOT }}"
          Write-Host "=== MSYS2 MinGW64 root: $root ==="
          Write-Host "=== Build outputs ==="
          Get-ChildItem application/Core/output/release/*.exe -EA SilentlyContinue
          Get-ChildItem application/GUI/output/release/*.exe -EA SilentlyContinue
          Write-Host "=== Qt5 DLLs ==="
          Get-ChildItem "$root/bin/Qt5*.dll" -EA SilentlyContinue | Select-Object Name
          Write-Host "=== ICU DLLs ==="
          Get-ChildItem "$root/bin/libicu*.dll" -EA SilentlyContinue | Select-Object Name

      # ── Installer ──────────────────────────────────────────
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Installer
        shell: pwsh
        working-directory: application/Setups/Windows
        run: |
          $root = "${{ steps.msys2root.outputs.MINGW_ROOT }}"
          # Override QtDir and MingwDir so .iss finds DLLs at the actual MSYS2 location
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DQtDir="$root" /DMingwDir="$root" windows_setup.iss

      # ── Release (only on push, not PRs) ────────────────────
      - name: Commit version bump, tag & publish release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v   = "${{ steps.version.outputs.VERSION }}"
          $vt  = "${{ steps.version.outputs.VERSION_TAG }}"
          $bt  = "${{ steps.version.outputs.BUILD_TIME }}"
          $tag = "v$v"
          $exe = (Get-ChildItem "application/Setups/Windows/Installations/*.exe")[0].FullName

          # Commit the version bump back to master
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add application/Common/Version.h
          git commit -m "ci: bump version to $v [skip ci]"
          git tag $tag
          git push origin master --tags

          # Create the GitHub release with the installer attached
          gh release create $tag $exe `
            --title "DG-LAN $v $vt" `
            --notes "Automated build $bt`nVersion: $v $vt" `
            --prerelease
