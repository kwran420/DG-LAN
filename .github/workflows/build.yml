name: Build DG-LAN

# ── HOW TO RELEASE ────────────────────────────────────────────
# 1. Update VERSION in application/Common/Version.h (e.g. "1.3.0")
# 2. Commit & push to master
# 3. Tag and push:  git tag v1.3.0 && git push --tags
# 4. CI builds the installer and publishes a GitHub Release
#
# Or use the GitHub UI:  Actions → Build DG-LAN → Run workflow
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── MSYS2 / MinGW64 tool-chain ──────────────────────────
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-protobuf
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-make
            make

      # ── Resolve version ─────────────────────────────────────
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $file = "application/Common/Version.h"
          $c = Get-Content $file -Raw
          $bt   = [DateTime]::UtcNow.ToString("yyyy-MM-dd_HH-mm")
          $hash = git rev-parse HEAD

          $ref = "${{ github.ref }}"
          if ($ref -match '^refs/tags/v(.+)$') {
            $ver = $Matches[1]
          } elseif ($c -match '#define VERSION "([^"]+)"') {
            $ver = $Matches[1]
          } else {
            Write-Error "Cannot determine version"; exit 1
          }

          $c = $c -replace '#define VERSION "[^"]*"',     "#define VERSION `"$ver`""
          $c = $c -replace '#define BUILD_TIME "[^"]*"',   "#define BUILD_TIME `"$bt`""
          $c = $c -replace '#define GIT_VERSION "[^"]*"',  "#define GIT_VERSION `"$hash`""
          Set-Content $file $c -NoNewline

          $tag = ""
          if ($c -match '#define VERSION_TAG "([^"]*)"') { $tag = $Matches[1] }

          "VERSION=$ver"       >> $env:GITHUB_OUTPUT
          "VERSION_TAG=$tag"   >> $env:GITHUB_OUTPUT
          "BUILD_TIME=$bt"     >> $env:GITHUB_OUTPUT
          Write-Host "Building: $ver $tag ($bt)"

      # ── Detect where MSYS2 actually installed Qt ────────────
      - name: Detect MSYS2 root
        id: msys2root
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path $env:RUNNER_TEMP "msys64\mingw64"),
            "D:\a\_temp\msys64\mingw64",
            "C:\msys64\mingw64"
          )
          foreach ($c in $candidates) {
            $exists = Test-Path "$c\bin\Qt5Core.dll"
            Write-Host "  $c  ->  Qt5Core.dll exists: $exists"
          }
          $root = $candidates | Where-Object { Test-Path "$_\bin\Qt5Core.dll" } |
                  Select-Object -First 1
          if (-not $root) { Write-Error "Cannot find MSYS2 MinGW64 root"; exit 1 }
          Write-Host "Using: $root"
          "MINGW_ROOT=$root" >> $env:GITHUB_OUTPUT

      # ── Patch .iss for this runner's paths + ICU version ────
      - name: Patch installer script for runner
        shell: pwsh
        run: |
          $root = "${{ steps.msys2root.outputs.MINGW_ROOT }}" -replace '\\','/'
          $iss  = "application/Setups/Windows/windows_setup.iss"
          $content = Get-Content $iss -Raw

          # Rewrite QtDir / MingwDir to the actual MSYS2 location
          $content = $content -replace '(?<=#define QtDir ")[^"]*',    $root
          $content = $content -replace '(?<=#define MingwDir ")[^"]*', $root

          # Patch ICU version to whatever is installed
          $dll = Get-ChildItem "$root/bin/libicuin*.dll" -EA SilentlyContinue |
                 Select-Object -First 1
          if ($dll -and $dll.Name -match 'libicuin(\d+)\.dll') {
            $v = $Matches[1]
            $content = $content -replace 'libicuin\d+', "libicuin$v"
            $content = $content -replace 'libicuuc\d+', "libicuuc$v"
            $content = $content -replace 'libicudt\d+', "libicudt$v"
            Write-Host "ICU version: $v"
          }

          Set-Content $iss $content -NoNewline
          Write-Host "QtDir patched to: $root"

      # ── Build ───────────────────────────────────────────────
      - name: Build Core
        shell: msys2 {0}
        working-directory: application
        run: |
          QMAKE=$(command -v qmake-qt5 || command -v qmake || echo /mingw64/bin/qmake)
          echo "Using qmake: $QMAKE"
          $QMAKE Core.pro -r -spec win32-g++ "CONFIG+=release"
          mingw32-make -f Makefile-Core -j$(nproc)

      - name: Build GUI
        shell: msys2 {0}
        working-directory: application
        run: |
          QMAKE=$(command -v qmake-qt5 || command -v qmake || echo /mingw64/bin/qmake)
          $QMAKE GUI.pro -r -spec win32-g++ "CONFIG+=release"
          mingw32-make -f Makefile-GUI -j$(nproc)

      # ── Installer ──────────────────────────────────────────
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Installer
        shell: pwsh
        working-directory: application/Setups/Windows
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows_setup.iss

      # ── Publish GitHub Release ──────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v   = "${{ steps.version.outputs.VERSION }}"
          $vt  = "${{ steps.version.outputs.VERSION_TAG }}"
          $bt  = "${{ steps.version.outputs.BUILD_TIME }}"
          $tag = "v$v"
          $exe = (Get-ChildItem "application/Setups/Windows/Installations/*.exe")[0].FullName

          gh release create $tag $exe `
            --title "DG-LAN $v $vt" `
            --notes "Version: $v $vt`nBuild: $bt" `
            --prerelease
