name: Publish DG-LAN Release

# ── HOW TO RELEASE ────────────────────────────────────────────
# The installer is built locally (much faster than CI).
#
# One-step:
#   .\build-release.ps1 -Publish
#
# Manual:
#   1. .\build-release.ps1              (builds the installer)
#   2. git add -A && git commit -m "chore: bump to vX.Y.Z"
#   3. git tag vX.Y.Z && git push && git push --tags
#   4. This workflow creates a GitHub Release and attaches the .exe
#
# The workflow is intentionally lightweight — no MSYS2, no compile.
# It just reads the pre-built installer from the repo (uploaded via
# build-release.ps1 -Publish) or creates a placeholder release for
# manual asset upload.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.3.0). Must already exist.'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VER="${TAG#v}"

          # Read VERSION_TAG from Version.h
          VT=$(grep '#define VERSION_TAG' application/Common/Version.h \
               | sed 's/.*"\(.*\)".*/\1/')

          echo "TAG=$TAG"   >> "$GITHUB_OUTPUT"
          echo "VERSION=$VER" >> "$GITHUB_OUTPUT"
          echo "VERSION_TAG=$VT" >> "$GITHUB_OUTPUT"
          echo "Publishing: $VER $VT (tag: $TAG)"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          VER="${{ steps.version.outputs.VERSION }}"
          VT="${{ steps.version.outputs.VERSION_TAG }}"

          # If the release already exists (created by build-release.ps1 -Publish),
          # just make sure it's not a draft.
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi

          # Otherwise create a release (the .exe can be uploaded manually or
          # via: gh release upload $TAG path/to/installer.exe)
          gh release create "$TAG" \
            --title "DG-LAN $VER $VT" \
            --notes "Version: $VER $VT" \
            --draft
          echo "Draft release created. Upload the installer with:"
          echo "  gh release upload $TAG path/to/DG-LAN-Setup.exe"
          echo "  gh release edit $TAG --draft=false"
